name: Document

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

concurrency: document-${{ github.base_ref }}

jobs:
  document:
    name: "Document"
    runs-on: ubuntu-latest
    if: ${{ github.triggering_actor != 'dependabot[bot]' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: "Code checkout"
        uses: actions/checkout@v7

      - name: "Checkout w/ gh"
        run: gh pr checkout ${{ github.event.pull_request.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup mise
        uses: jdx/mise-action@v4.3.0

      - name: "Generate documentation"
        run: ./scripts/document.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "Commit if Necessary"
        run: |
          echo "Setting core.fileMode to false to avoid false positives in documentation check."
          git config core.fileMode false
          if [[ -n $(git status --porcelain) ]]; then
            echo "Documentation is not up to date. Committing updates"
            git add README.md
            git config user.name "${GITHUB_USERNAME}"
            git config user.email "${GITHUB_USERNAME}@users.noreply.github.com"
            git commit -m "Running document script"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.actor }}
